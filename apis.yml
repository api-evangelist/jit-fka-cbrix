aid: jit-fka-cbrix
name: Jit (fka Cbrix)
description: 'Jit is an AI-powered Application Security Posture Management (ASPM) and
  DevSecOps orchestration platform for modern engineering teams. It unifies open-source
  and proprietary security scanners (Semgrep, Prowler, KICS, OWASP ZAP, Trivy, npm-audit,
  Wiz and more) behind one control plane, correlates their signals, prioritizes findings
  by policy, and drives fix-focused remediation directly in the developer workflow.
  Jit exposes a REST API at api.jit.io with OAuth2 client-credentials (JWT bearer)
  authentication and a fine-grained jit.* permission model covering findings, artifacts,
  teams, plans, policies, workflows, integrations, and scan execution. Formerly Cbrix,
  Jit is backed by Insight Partners and integrates across GitHub, GitLab, Bitbucket,
  Azure DevOps, AWS, GCP, and Azure.'
